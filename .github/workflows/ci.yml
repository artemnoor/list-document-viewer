name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run unit, contract, property, regression, and API tests
        run: python -m pytest --tb=short

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLZA_AI_ENABLED: "false"
      VERIFICATION_AUTH_MODE: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start service
        run: docker compose up --build --detach
      - name: Check health, API, persistence, and history
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent http://127.0.0.1:8000/docs >/dev/null
          curl --fail --silent http://127.0.0.1:8000/openapi.json | python -c 'import json,sys; assert json.load(sys.stdin)["info"]["version"] == "1.1.0"'
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @examples/request-matched.json \
            http://127.0.0.1:8000/api/v1/verifications > /tmp/verification-result.json
          python -c 'import json; r=json.load(open("/tmp/verification-result.json", encoding="utf-8")); assert r["overall_status"] == "matched"; assert r["schema_version"] == "1.1.0"; assert r["completeness"]["complete"] is True'
          verification_id="$(python -c 'import json; print(json.load(open("/tmp/verification-result.json", encoding="utf-8"))["verification_id"])')"
          curl --fail --silent "http://127.0.0.1:8000/api/v1/verifications/${verification_id}?project_id=synthetic-project" | python -c 'import json,sys; assert json.load(sys.stdin)["overall_status"] == "matched"'
          curl --fail --silent 'http://127.0.0.1:8000/api/v1/verifications?project_id=synthetic-project' | python -c 'import json,sys; assert len(json.load(sys.stdin)["items"]) >= 1'
      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes
