name: Phystech Trace Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway-and-benchmarks:
    name: Gateway and public financial benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r phystech-trace/tests/requirements.txt
      - run: python -m pytest tests -q
        working-directory: phystech-trace
      - run: python benchmarks/run.py --output benchmarks/results/ci-financial-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-benchmark
          path: benchmarks/results/ci-financial-audit.json

  calculation-engines:
    name: Reconciliation and Verification tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        engine: [reconciliation-engine, verification-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
        working-directory: phystech-trace/services/${{ matrix.engine }}
      - run: python -m pytest -q
        working-directory: phystech-trace/services/${{ matrix.engine }}

  docker-smoke:
    name: Fresh-volume Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build, start, probe and clean up isolated stack
        run: python scripts/verify_docker.py --build --output benchmarks/results/ci-docker-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke
          path: benchmarks/results/ci-docker-smoke.*

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Run backend unit tests
        run: python -m pytest backend/tests -q

  shared-contracts:
    name: Shared contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract test dependency
        run: python -m pip install jsonschema
      - name: Run shared contract tests
        run: python -m unittest discover -s phystech-trace/tests/contracts -v

  extraction-unit:
    name: Structured Extraction unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phystech-trace/services/structured-extraction/package-lock.json
      - name: Install standalone runtime dependencies
        working-directory: phystech-trace/services/structured-extraction
        run: npm run install:ci
      - name: Run Extraction unit tests
        working-directory: phystech-trace/services/structured-extraction
        run: npm test

  linking:
    name: Document Linking unit tests, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phystech-trace/services/document-linking/package-lock.json
      - name: Install dependencies
        working-directory: phystech-trace/services/document-linking
        run: npm ci
      - name: Run Linking unit tests
        working-directory: phystech-trace/services/document-linking
        run: npm test
      - name: Typecheck Linking
        working-directory: phystech-trace/services/document-linking
        run: npm run typecheck
      - name: Build Linking
        working-directory: phystech-trace/services/document-linking
        run: npm run build

  frontend:
    name: Vue frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phystech-trace/frontend/package-lock.json
      - name: Install dependencies
        working-directory: phystech-trace/frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: phystech-trace/frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: phystech-trace/frontend
        run: npm run build
