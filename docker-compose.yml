services:
  verification-engine:
    build: .
    ports:
      - "127.0.0.1:${VERIFICATION_PORT:-8000}:8000"
    environment:
      VERIFICATION_DB_PATH: /data/verification.sqlite3
      VERIFICATION_AUTH_MODE: ${VERIFICATION_AUTH_MODE:-development}
      VERIFICATION_PROJECT_TOKENS: "${VERIFICATION_PROJECT_TOKENS:-{}}"
      VERIFICATION_MAX_REQUEST_BYTES: ${VERIFICATION_MAX_REQUEST_BYTES:-16777216}
      VERIFICATION_REQUEST_TIMEOUT_SECONDS: ${VERIFICATION_REQUEST_TIMEOUT_SECONDS:-30}
      VERIFICATION_MAX_PROCESSING_SECONDS: ${VERIFICATION_MAX_PROCESSING_SECONDS:-30}
      VERIFICATION_ARTIFACT_ROOT: ${VERIFICATION_ARTIFACT_ROOT:-}
      VERIFICATION_MAX_ARTIFACT_BYTES: ${VERIFICATION_MAX_ARTIFACT_BYTES:-16777216}
      VERIFICATION_ARTIFACT_CACHE_BYTES: ${VERIFICATION_ARTIFACT_CACHE_BYTES:-67108864}
      POLZA_AI_ENABLED: ${POLZA_AI_ENABLED:-true}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY:-}
      POLZA_AI_MODEL: ${POLZA_AI_MODEL:-google/gemma-4-26b-a4b-it}
      POLZA_AI_BASE_URL: ${POLZA_AI_BASE_URL:-https://polza.ai/api/v1}
      POLZA_AI_TIMEOUT_SECONDS: ${POLZA_AI_TIMEOUT_SECONDS:-10}
    volumes:
      - verification-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  verification-data:
