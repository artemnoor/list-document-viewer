name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: document_linking_test
          POSTGRES_USER: document_linking
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U document_linking -d document_linking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:contract
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://document_linking:ci-postgres-password@127.0.0.1:5432/document_linking_test
          REDIS_URL: redis://127.0.0.1:6379
      - run: docker build --tag kfz-document-linking:ci .
