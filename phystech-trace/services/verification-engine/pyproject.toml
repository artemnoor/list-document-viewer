[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phystech-trace-verification-engine"
version = "1.2.0"
description = "Evidence-first verification of KFZ metrics against Reconciliation results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "jsonschema>=4.22,<5.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "hypothesis>=6.100,<7.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
