server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $gateway http://gateway:8084;

  location /api/ {
    proxy_pass $gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
  }

  location /health {
    proxy_pass $gateway/health;
  }

  location = / {
    if ($arg_project != "") { return 302 /app/$is_args$args; }
    try_files /index.html =404;
  }

  location = /app { return 302 /app/$is_args$args; }
  location ~ ^/login(/index\.html|/)?$ { return 302 /logIn$is_args$args; }
  location ~ ^/(recover|book-a-demo)(/index\.html|/)?$ { return 302 /register$is_args$args; }
  location ~ ^/(logIn|register)(/index\.html|/)?$ { try_files /$1/index.html =404; }
  location /app/assets/ { try_files $uri =404; }
  location /app/brand/ { try_files $uri =404; }
  location /app/ { try_files $uri $uri/ /app/index.html; }
  location / { try_files $uri $uri/ =404; }
}
