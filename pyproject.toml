[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phystech-trace-reconciliation-engine"
version = "0.1.0"
description = "Evidence-preserving expected-value calculations for Phystech Trace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["reconciliation_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.fastapi]
entrypoint = "reconciliation_engine.api:app"
